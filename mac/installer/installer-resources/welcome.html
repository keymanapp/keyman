<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            font-size: 13px;
            color: #333333;
            line-height: 1.5;
            padding: 15px;
        .bg-graphic {
            position: absolute;
            bottom: 10px;
            left: 10px;
            width: 150px; /* Adjust size as needed */
            z-index: -1;  /* Keeps it behind the text flow */
            opacity: 0.8;
        }

        .text-content {
            position: relative;
            z-index: 1;
        }
        h1 {
            font-size: 18px;
            font-weight: bold;
            color: #000000;
            margin-bottom: 15px;
        }
        p {
            margin-bottom: 12px;
        }
        .highlight {
            font-weight: bold;
        }
        
    </style>
</head>
<body>
    <p>This installer will guide you through the steps required to install <strong>Keyman for Mac</strong></p>
    
    <p>When installation is complete, you will be prompted to restart your Mac. 
      After restarting, run the <strong>Keyman Configuration</strong> application to complete setup.</p>
    
    <p>Click <span class="highlight">Continue</span> to begin the setup process.</p>

    <img src="keyman-logo.png" class="bg-graphic" alt="" />

</body>
</html>
